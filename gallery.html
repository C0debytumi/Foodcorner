<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Food Corner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo"><img src="images/logo-480w.jpg" alt="Food Corner logo" class="logo-img" /></a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow">A look inside</p>
          <h1>From the grill to your hands</h1>
        </div>

        <!--
          3.3 Responsive Images:
          Use srcset + sizes so the browser picks the right file for the
          viewport, instead of shipping one large image to every device.
          Replace the placeholder paths below with your real photos in
          three widths (e.g. -480w, -768w, -1200w) once you have them.
        -->
        <div class="gallery-grid">
          <figure>
            <img
              src="images/storefront-768w.jpg"
              srcset="images/storefront-480w.jpg 480w,
                      images/storefront-768w.jpg 768w,
                      images/storefront-1200w.jpg 1200w"
              sizes="(max-width: 480px) 100vw,
                     (max-width: 1024px) 50vw,
                     33vw"
              alt="The Food Corner shopfront, with outdoor seating on the street" />
          </figure>
          <figure>
            <img
              src="images/menu-board-768w.jpg"
              srcset="images/menu-board-480w.jpg 480w,
                      images/menu-board-768w.jpg 768w,
                      images/menu-board-1200w.jpg 1200w"
              sizes="(max-width: 480px) 100vw,
                     (max-width: 1024px) 50vw,
                     33vw"
              alt="The Food Corner menu board showing wraps, boxes, plates, and quarters" />
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div>
        <p class="logo"><img src="images/logo-480w.jpg" alt="Food Corner logo" class="logo-img logo-img--footer" /></p>
        <p>7 Market Street, Garankuwa</p>
      </div>
      <nav>
        <a href="index.html">Home</a> &nbsp;·&nbsp;
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
